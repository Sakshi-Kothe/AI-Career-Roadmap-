<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Career Roadmap System - Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1c1c1c; color: #fff; }
    header { background: #2c3e50; padding: 20px; text-align: center; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { padding: 60px; text-align: center; }
    h2 { font-size: 2em; margin-bottom: 20px; }
    form { max-width: 500px; margin: 0 auto; text-align: left; }
    label { display: block; margin: 10px 0 5px; }
    input, select { width: 100%; padding: 10px; margin-bottom: 15px; border: none; border-radius: 5px; }
    button { padding: 12px 25px; font-size: 16px; margin: 10px 5px; cursor: pointer; border: none; background: #3498db; color: #fff; border-radius: 5px; }
    button:hover { background: #2980b9; }
    footer { background: #2c3e50; text-align: center; padding: 15px; margin-top: 40px; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>AI Career Roadmap System</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Student Registration</h2>
    <form action="profile.html" method="post">
      <label>Full Name:</label>
      <input type="text" name="fullname"placeholder="Enter user name" required>

      <label>Email ID:</label>
      <input type="email" name="email" placeholder="Enter email ID" required>

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter password" required>
      <label>College Name:</label>
      <input type="text" name="college" placeholder="Enter college name">

      <label>Branch:</label>
      <select name="branch">
        <option>IT</option>
        <option>CSE</option>
        <option>ECE</option>
      </select>

      <label>Year of Study:</label>
      <select name="year">
        <option>1st</option>
        <option>2nd</option>
        <option>3rd</option>
      </select>

      <button type="submit">Register</button>
      <button type="reset">Reset</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Career Roadmap System | Screen 2: Student Registration</p>
  </footer>
</body>
</html>
