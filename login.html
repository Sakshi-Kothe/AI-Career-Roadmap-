<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Career Roadmap System - Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #1c1c1c; color: #fff; }
    header { background: #2c3e50; padding: 20px; text-align: center; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { padding: 60px; text-align: center; }
    h2 { font-size: 2em; margin-bottom: 20px; }
    form { max-width: 400px; margin: 0 auto; text-align: left; }
    label { display: block; margin: 10px 0 5px; }
    input { width: 100%; padding: 10px; margin-bottom: 15px; border: none; border-radius: 5px; }
    button { padding: 12px 25px; font-size: 16px; margin: 10px 5px; cursor: pointer; border: none; background: #3498db; color: #fff; border-radius: 5px; }
    button:hover { background: #2980b9; }
    a { color: #3498db; text-decoration: none; }
    a:hover { text-decoration: underline; }
    footer { background: #2c3e50; text-align: center; padding: 15px; margin-top: 40px; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>AI Career Roadmap System</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Login</h2>
    <form action="profile.html" method="post">
      <label>Email ID:</label>
      <input type="email" name="email" placeholder="Enter email ID" required>

      <label>Password:</label>
      <input type="password" name="password" placeholder="Enter Password" required>
      
      
      <button onclick="location.href='profile.html'">Student login</button>
      <p><a href="#">Forgot Password?</a></p>
      <button onclick="location.href='Admin.html'">Admin login</button>
    </form>
  </main>

  <footer>
    <p>© 2026 Career Roadmap System | Screen 3: Login</p>
  </footer>
</body>
</html>
