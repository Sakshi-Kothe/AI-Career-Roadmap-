<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Career Roadmap System - Progress Dashboard</title>
  <!-- Load Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #121212; color: #fff; }
    header { background: #2c3e50; padding: 20px; text-align: center; }
    nav a { color: #fff; margin: 0 15px; text-decoration: none; font-weight: bold; }
    nav a:hover { text-decoration: underline; }
    main { padding: 60px; max-width: 1000px; margin: 0 auto; }
    h2 { font-size: 2.4em; margin-bottom: 40px; text-align: center; color: #3498db; }

    .stats-container { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .card { background: #1e1e1e; border-radius: 8px; padding: 20px; width: 220px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
    .card h3 { color: #3498db; margin-bottom: 10px; }
    .card p { font-size: 1.2em; margin: 0; }

    canvas { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-top: 40px; }

    table { width: 100%; border-collapse: collapse; margin-top: 40px; }
    th, td { border: 1px solid #2c3e50; padding: 12px; text-align: center; }
    th { background: #2c3e50; }
    td { background: #1e1e1e; }

    button { display: block; margin: 40px auto 0; padding: 14px 30px; font-size: 16px; cursor: pointer; border: none; background: #3498db; color: #fff; border-radius: 6px; }
    button:hover { background: #2980b9; }

    footer { background: #2c3e50; text-align: center; padding: 15px; margin-top: 40px; color: #ccc; }
  </style>
</head>
<body>
  <header>
    <h1>AI Career Roadmap System</h1>
    <nav>
      <a href="home.html">Home</a>
      <a href="login.html">Login</a>
      <a href="register.html">Register</a>
      <a href="roadmap.html">Roadmap</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <h2>Progress Tracking Dashboard</h2>

    <div class="stats-container">
      <div class="card">
        <h3>Skills Completed</h3>
        <p>60%</p>
      </div>
      <div class="card">
        <h3>Tasks Done</h3>
        <p>8/10</p>
      </div>
      <div class="card">
        <h3>Hours Studied</h3>
        <p>15 hrs</p>
      </div>
      <div class="card">
        <h3>Roadmap Progress</h3>
        <p>60%</p>
      </div>
    </div>

    <!-- Progress Graph -->
    <canvas id="progressChart"></canvas>

    <h3 style="color:#3498db; margin-top:40px;">Weekly Performance</h3>
    <table>
      <tr>
        <th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th><th>Sun</th>
      </tr>
      <tr>
        <td>✔</td><td>✔</td><td>✔</td><td>✔</td><td>✔</td><td>✔</td><td>✔</td>
      </tr>
    </table>

    
  </main>

  <footer>
    <p>© 2026 Career Roadmap System | Screen 8: Progress Tracking Dashboard</p>
  </footer>

  <script>
    const ctx = document.getElementById('progressChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Skills Completed', 'Tasks Done', 'Hours Studied', 'Roadmap Progress'],
        datasets: [{
          label: 'Progress Metrics',
          data: [60, 80, 15, 60], // Example values
          backgroundColor: ['#3498db', '#1abc9c', '#9b59b6', '#e67e22']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { labels: { color: '#fff' } }
        },
        scales: {
          x: { ticks: { color: '#fff' } },
          y: { ticks: { color: '#fff' }, beginAtZero: true }
        }
      }
    });
  </script>
  <button onclick="location.href='feedback.html'">Go To Feedback</button><button onclick="location.href='home.html'">Go To Home</button>
</body>
</html>
